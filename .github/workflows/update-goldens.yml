name: Update goldens (Linux)

# Goldens must be rendered on Linux, the CI platform. Run this from the
# Actions tab after UI changes made on macOS; it commits the new images to
# the same branch.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: "3.50.0"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test --update-goldens --tags golden
      - name: Commit goldens
        run: |
          git config user.name "userproject02"
          git config user.email "275130919+userproject02@users.noreply.github.com"
          git add -A test
          git diff --cached --quiet && echo "No golden changes" && exit 0
          # The context guard requires a CLAUDE.md change-log line with
          # every test/ change.
          python3 - <<'PY'
          import datetime
          p = 'CLAUDE.md'
          s = open(p).read()
          head = s.index('## Change log')
          body = s.index('\n\n', head) + 2
          line = (f'- {datetime.date.today()} · ci/update-goldens · goldens '
                  're-rendered on Linux · test/**/goldens · CI renders on '
                  'Linux\n')
          open(p, 'w').write(s[:body] + line + s[body:])
          PY
          git add CLAUDE.md
          git commit -m "test: regenerate goldens on Linux"
          git push
