name: clinical_edge
description: "ClinicalEdge — training, certification and CPD tracking for UAE healthcare professionals (iOS + Android)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0

# Versions are pinned with caret ranges; the exact resolved versions live in
# pubspec.lock and the table in AGENTS.md → Packages.
dependencies:
  crypto: ^3.0.8
  cupertino_icons: ^1.0.8
  file_picker: ^13.4.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.11.1
  pdf: ^3.13.1
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.17.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  hive_ce_generator: ^1.12.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  # Seed data (schema is a contract: CLAUDE.md → Do-not-break contracts).
  assets:
    - lib/seed/

  # Fonts are bundled so the app renders identically offline (see CLAUDE.md →
  # Decisions for why google_fonts is not used at runtime). Licences: OFL-*.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

# App icon: logo mark (heartbeat in a rounded square, #0A6E73), rendered by
# `flutter test tool/icon/render_icon_test.dart`. Apply with
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0A6E73"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 26

# Splash: logo mark on brand teal. Apply with
# `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#0A6E73"
  image: assets/icon/splash.png
  android_12:
    color: "#0A6E73"
    image: assets/icon/splash.png
