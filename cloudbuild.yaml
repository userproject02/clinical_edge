# Google Cloud Build: test and build the Android app, then store the APK and
# AAB in Cloud Storage (and optionally send the APK to Firebase App
# Distribution testers). ClinicalEdge has no web target, and iOS builds need
# macOS, so Cloud Build only produces Android artefacts.
#
# Run with: bash tool/deploy_gcp.sh  (or gcloud builds submit --config ...)
substitutions:
  _BUCKET: ""                 # e.g. my-project-clinicaledge-builds (required)
  _FIREBASE_APP_ID: ""        # optional: Firebase Android app id
  _TESTER_GROUPS: "testers"   # optional: App Distribution group(s)
  _SHA: "manual"              # build label for manual submits (triggers use SHORT_SHA)
  _ANDROID_IMAGE: ghcr.io/cirruslabs/android-sdk:36
  _FLUTTER_VERSION: "3.50.0"  # pinned, same as CI

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s

steps:
  # One step for toolchain, tests and build: only /workspace persists
  # between steps, so the SDK platform installed here must be used here.
  - id: build
    name: ${_ANDROID_IMAGE}
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        git clone --depth 1 --branch ${_FLUTTER_VERSION} https://github.com/flutter/flutter.git /workspace/.flutter
        export PATH="/workspace/.flutter/bin:$$PATH"
        # flutter_local_notifications needs compileSdk 37.
        yes | sdkmanager "platforms;android-37.0" >/dev/null || true
        flutter config --no-analytics
        flutter --version
        flutter pub get
        dart run build_runner build -d
        flutter analyze
        flutter test --exclude-tags golden
        # v1 is a prototype without release signing: the APK is a debug
        # build for testers; the AAB is unsigned (sign before Play upload).
        flutter build apk --debug
        flutter build appbundle --release || echo "AAB build skipped"
        mkdir -p dist
        TAG="${SHORT_SHA}"
        [ -n "$$TAG" ] || TAG="${_SHA}"
        echo "$$TAG" > dist/.tag
        VERSION=$$(grep '^version:' pubspec.yaml | awk '{print $$2}')
        cp build/app/outputs/flutter-apk/app-debug.apk "dist/clinicaledge-$${VERSION}-$${TAG}-debug.apk"
        if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
          cp build/app/outputs/bundle/release/app-release.aab "dist/clinicaledge-$${VERSION}-$${TAG}.aab"
        fi
        ls -la dist

  - id: upload
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        test -n "${_BUCKET}" || { echo "Set _BUCKET"; exit 1; }
        TAG=$$(cat dist/.tag)
        gcloud storage cp dist/clinicaledge-* "gs://${_BUCKET}/builds/$${TAG}/"
        gcloud storage cp dist/*-debug.apk "gs://${_BUCKET}/latest/clinicaledge-debug.apk"
        echo "Uploaded to gs://${_BUCKET}/builds/$${TAG}/"

  - id: distribute
    name: node:20
    entrypoint: bash
    args:
      - -c
      - |
        if [ -z "${_FIREBASE_APP_ID}" ]; then
          echo "No _FIREBASE_APP_ID: skipping Firebase App Distribution"
          exit 0
        fi
        npm i -g firebase-tools >/dev/null
        firebase appdistribution:distribute dist/*-debug.apk \
          --app "${_FIREBASE_APP_ID}" --groups "${_TESTER_GROUPS}" \
          --release-notes "ClinicalEdge $$(cat dist/.tag)"
